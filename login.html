<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eBOTO | USTP Jasaan E-Voting System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --ustp-blue: #003366;
      --ustp-light-blue: #0066cc;
      --ustp-gold: #ffcc00;
      --ustp-white: #ffffff;
      --ustp-dark-blue: #002244;
      --ustp-light-gray: #f5f5f5;
      --ustp-dark-gray: #333333;
      --success-color: #4cd964;
      --error-color: #ff6b6b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      background-image: url(assests/bg.png);
      background-size: cover;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      color: var(--ustp-white);
      position: relative;
    }

    /* Overlay to improve text readability */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 51, 102, 0.4);
      z-index: -1;
    }

    /* HEADER */
    header {
      background: rgba(0, 51, 102, 0.85);
      color: var(--ustp-white);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 30px;
      border-bottom: 3px solid var(--ustp-gold);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
      z-index: 2;
      backdrop-filter: blur(5px);
    }

    .header-left {
      display: flex;
      align-items: center;
    }

    header img {
      height: 60px;
      width: 60px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 15px;
      border: 2px solid var(--ustp-gold);
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .header-right {
      display: flex;
      gap: 15px;
    }

    .header-icon {
      font-size: 1.2rem;
      color: var(--ustp-gold);
      transition: transform 0.3s;
    }

    .header-icon:hover {
      transform: scale(1.1);
    }

    /* LOGIN CONTAINER */
    .login-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      background: rgba(255, 255, 255, 0.88);
      border-radius: 16px;
      width: 400px;
      padding: 40px 35px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
      color: var(--ustp-dark-gray);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .login-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, var(--ustp-blue), var(--ustp-gold));
    }

    .login-box img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid var(--ustp-gold);
      margin-bottom: 15px;
      object-fit: cover;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .login-box h2 {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--ustp-blue);
      margin-bottom: 10px;
    }

    .login-box p {
      font-size: 0.95rem;
      color: var(--ustp-dark-gray);
      margin-bottom: 30px;
    }

    .input-box {
      position: relative;
      margin-bottom: 25px;
    }

    .input-box input {
      width: 100%;
      padding: 15px 45px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.8);
      color: var(--ustp-dark-gray);
      font-size: 1rem;
      transition: all 0.3s;
    }

    .input-box input:focus {
      border-color: var(--ustp-light-blue);
      outline: none;
      box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.2);
      background: white;
    }

    .input-box i {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ustp-blue);
      transition: color 0.3s;
    }

    .input-box input:focus + i {
      color: var(--ustp-light-blue);
    }

    .icon-left { left: 15px; }
    .toggle { right: 15px; cursor: pointer; color: var(--ustp-blue); }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: var(--ustp-dark-gray);
      margin-bottom: 25px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .remember input {
      accent-color: var(--ustp-blue);
    }

    .options a {
      color: var(--ustp-light-blue);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
    }

    .options a:hover {
      color: var(--ustp-blue);
      text-decoration: underline;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--ustp-blue), var(--ustp-light-blue));
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(0, 102, 204, 0.3);
    }

    .login-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0, 102, 204, 0.4);
    }

    .login-btn:active {
      transform: translateY(-1px);
    }

    .message {
      margin-top: 15px;
      font-weight: 600;
      min-height: 20px;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      transition: all 0.3s;
    }

    .success {
      background-color: rgba(76, 217, 100, 0.1);
      color: var(--success-color);
      border: 1px solid var(--success-color);
    }

    .error {
      background-color: rgba(255, 107, 107, 0.1);
      color: var(--error-color);
      border: 1px solid var(--error-color);
    }

    footer {
      background: rgba(0, 51, 102, 0.85);
      color: var(--ustp-white);
      text-align: center;
      padding: 15px;
      font-size: 0.9rem;
      border-top: 3px solid var(--ustp-gold);
      box-shadow: 0 -3px 8px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(5px);
    }

    /* Loading Animation */
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        text-align: center;
        gap: 10px;
      }
      
      .header-left, .header-right {
        justify-content: center;
      }
      
      .login-box {
        width: 90%;
        padding: 30px 25px;
      }
    }

    @media (max-width: 450px) {
      header h1 {
        font-size: 1rem;
      }
      
      .login-box {
        padding: 25px 20px;
      }
      
      .options {
        flex-direction: column;
        gap: 15px;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <img src="assests/suffage.png" alt="USTP Logo">
      <h1>ElecTechSuffrage: A Web-Based Platform at USTP Jasaan's Official E-Voting System for Student Organizations</h1>
    </div>
  </header>

  <div class="login-wrapper">
    <div class="login-box">
      <img src="assests/suffage.png" alt="Voting Icon">
      <h2>LOGIN</h2>
      <p>Enter your Student ID and Password to access the voting system</p>

      <div class="input-box">
        <i class="fas fa-user icon-left"></i>
        <input type="text" id="studentID" placeholder="Student ID (e.g. 202300015)" required>
      </div>

      <div class="input-box">
        <i class="fas fa-lock icon-left"></i>
        <input type="password" id="password" placeholder="Password" required>
        <i class="fas fa-eye toggle" id="togglePwd"></i>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" id="rememberMe">
          Remember me
        </label>
        <a href="#">Forgot Password?</a>
      </div>

      <button class="login-btn" id="loginButton" onclick="login()">
        <span id="buttonText">Login</span>
        <span id="buttonLoading" class="loading" style="display: none;"></span>
      </button>
      <div class="message" id="message"></div>
    </div>
  </div>

  <footer>
    © 2025 eBOTO | USTP Jasaan | All Rights Reserved
  </footer>

  <script>
    const togglePwd = document.getElementById("togglePwd");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const buttonText = document.getElementById("buttonText");
    const buttonLoading = document.getElementById("buttonLoading");
    const rememberMe = document.getElementById("rememberMe");

    // Check if credentials are saved
    document.addEventListener('DOMContentLoaded', function() {
      const savedID = localStorage.getItem('savedStudentID');
      if (savedID) {
        document.getElementById('studentID').value = savedID;
        rememberMe.checked = true;
      }
    });

    togglePwd.addEventListener("click", () => {
      const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
      passwordInput.setAttribute("type", type);
      togglePwd.classList.toggle('fa-eye');
      togglePwd.classList.toggle('fa-eye-slash');
    });

    // Enter key to submit
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        login();
      }
    });

    function login() {
    const username = document.getElementById("studentID").value.trim();
    const password = document.getElementById("password").value.trim();
    const msg = document.getElementById("message");

    msg.textContent = "";
    msg.className = "message";

    if (!username || !password) {
        msg.textContent = "Please enter both Student ID and Password.";
        msg.className = "message error";
        return;
    }

    buttonText.textContent = "Logging in...";
    buttonLoading.style.display = "inline-block";
    loginButton.disabled = true;

    fetch('./login.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === 'success') {
            window.location.href = data.redirect;
        } else {
            msg.textContent = data.message;
            msg.className = "message error";
            buttonText.textContent = "Login";
            buttonLoading.style.display = "none";
            loginButton.disabled = false;
        }
    })
    .catch(err => {
        msg.textContent = "An error occurred. Please try again.";
        msg.className = "message error";
        buttonText.textContent = "Login";
        buttonLoading.style.display = "none";
        loginButton.disabled = false;
    });
}

  </script>
</body>
</html>
